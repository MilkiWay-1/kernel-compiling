name: Compilador Automatizado Eureka Kernel A30s

on:
  workflow_dispatch: # Permite ativar a compilação clicando em um botão

jobs:
  build-kernel:
    runs-on: ubuntu-22.04
    steps:
      - name: Instalar Dependências do Sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential libncurses5-dev libssl-dev libelf-dev bison flex lld-14 clang-14

      - name: Baixar Código Fonte do Eureka Kernel
        run: |
          git clone --depth 1 https://github.com kernel
          cd kernel
          git submodule update --init --recursive

      - name: Baixar Proton Clang Oficial
        run: |
          git clone --depth 1 https://github.com toolchain

      - name: Injetar Flags do Droidspaces no Defconfig
        run: |
          cat << EOF >> kernel/arch/arm64/configs/exynos7885-a30s_defconfig
          CONFIG_NAMESPACES=y
          CONFIG_IPC_NS=y
          CONFIG_NET_NS=y
          CONFIG_CGROUPS=y
          CONFIG_KERNELSU=n
          EOF

      - name: Compilar o Kernel na Nuvem
        run: |
          cd kernel
          export PATH="$GITHUB_WORKSPACE/toolchain/bin:$PATH"
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- CC=clang HOSTCC=gcc exynos7885-a30s_defconfig
          make -j$(nproc --all) ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- CC=clang HOSTCC=gcc Image.gz-dtb

      - name: Upload do Arquivo Pronto
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Eureka-A30s-Droidspaces
          path: kernel/arch/arm64/boot/Image.gz-dtb
