
name: Compilador Automatizado Eureka Kernel A30s

'on':
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-kernel:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Instalar Dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc build-essential git libncurses-dev libssl-dev \
            libelf-dev bison flex python3 make

      - name: Baixar Código Fonte Eureka
        run: |
          git clone --depth 1 \
            https://github.com/eurekadevelopment/Eureka-Kernel \
            kernel

          cd kernel
          git submodule update --init --recursive

      - name: Baixar Toolchain
        run: |
          git clone --depth 1 \
            https://github.com/Chatur27/Toolchains-for-Eureka \
            toolchain

          echo "Arquivos encontrados na toolchain:"
          find toolchain -maxdepth 4 -type f \
            \( -name clang \
            -o -name aarch64-linux-gnu-gcc \
            -o -name aarch64-linux-gnu-ld \
            -o -name arm-linux-gnueabi-gcc \) -print

          CLANG="$(find "$GITHUB_WORKSPACE/toolchain" \
            -type f -name clang -executable -print -quit)"

          if [ -z "$CLANG" ]; then
            echo "::error::Clang não encontrado na toolchain."
            exit 1
          fi

          echo "CLANG=$CLANG" >> "$GITHUB_ENV"
          echo "Clang encontrado: $CLANG"

      - name: Preparar Configuração
        run: |
          DEFCONFIG="kernel/arch/arm64/configs/exynos7885-a30s_defconfig"

          if [ ! -f "$DEFCONFIG" ]; then
            echo "::error::Defconfig do A30s não encontrado."
            exit 1
          fi

          cat >> "$DEFCONFIG" <<'EOF'

          # Opções solicitadas para Droidspaces
          CONFIG_NAMESPACES=y
          CONFIG_IPC_NS=y
          CONFIG_NET_NS=y
          CONFIG_CGROUPS=y
          EOF

      - name: Configurar Kernel
        working-directory: kernel
        run: |
          export PATH="$(dirname "$CLANG"):$PATH"

          make ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            CC="$CLANG" \
            HOSTCC=gcc \
            exynos7885-a30s_defconfig

          make ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            CC="$CLANG" \
            HOSTCC=gcc \
            olddefconfig

          echo "Verificando configuração gerada:"
          grep -E '^(CONFIG_NAMESPACES|CONFIG_IPC_NS|CONFIG_NET_NS|CONFIG_CGROUPS)=' .config || true

          for option in CONFIG_NAMESPACES CONFIG_IPC_NS CONFIG_NET_NS CONFIG_CGROUPS; do
            if ! grep -qx "${option}=y" .config; then
              echo "::error::$option não está habilitado na configuração final."
              exit 1
            fi
          done

      - name: Compilar Kernel
        working-directory: kernel
        run: |
          export PATH="$(dirname "$CLANG"):$PATH"

          make -j"$(nproc)" \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            CC="$CLANG" \
            HOSTCC=gcc

      - name: Verificar Imagem
        run: |
          echo "Arquivos produzidos:"
          find kernel/arch/arm64/boot -maxdepth 2 -type f -print

          IMAGE="kernel/arch/arm64/boot/Image.gz-dtb"

          if [ ! -s "$IMAGE" ]; then
            echo "::error::A imagem Image.gz-dtb não foi encontrada."
            exit 1
          fi

      - name: Upload do Arquivo
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Eureka-A30s-Droidspaces
          path: kernel/arch/arm64/boot/Image.gz-dtb
          if-no-files-found: error
```
