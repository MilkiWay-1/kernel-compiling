name: Compilador Automatizado Eureka Kernel A30s

'on':
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-kernel:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Instalar Dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc build-essential git libncurses-dev libssl-dev \
            libelf-dev bison flex python3 make

      - name: Baixar Código Fonte Eureka
        run: |
          git clone --depth 1 \
            https://github.com/eurekadevelopment/Eureka-Kernel \
            kernel

          cd kernel
          git submodule update --init --recursive

      - name: Baixar e Inspecionar Toolchain
        run: |
          git clone --depth 1 \
            --branch proton_clang_13 \
            https://github.com/Chatur27/Toolchains-for-Eureka \
            toolchain

          echo "=== Toolchain directory ==="
          ls -la toolchain/
          echo "=== bin directory ==="
          ls -la toolchain/bin/ || true

          echo "=== Searching for Clang ==="
          find toolchain \( -type f -o -type l \) \
            \( -name clang -o -name 'clang-[0-9]*' \
            -o -name clang++ \) -print

          CLANG="$(find "$GITHUB_WORKSPACE/toolchain" \
            \( -type f -o -type l \) \
            -name clang -executable -print -quit)"

          if [ -z "$CLANG" ]; then
            echo "::error::No executable named clang was found."
            exit 1
          fi

          echo "Found Clang at: $CLANG"
          echo "CLANG=$CLANG" >> "$GITHUB_ENV"
          echo "$GITHUB_WORKSPACE/toolchain/bin" >> "$GITHUB_PATH"

      - name: Configurar Kernel
        working-directory: kernel
        run: |
          make ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            CC="$CLANG" \
            HOSTCC=gcc \
            exynos7885-a30s_defconfig

          scripts/config --enable NAMESPACES
          scripts/config --enable SYSVIPC
          scripts/config --enable IPC_NS
          scripts/config --enable NET_NS
          scripts/config --enable CGROUPS

          make ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            CC="$CLANG" \
            HOSTCC=gcc \
            olddefconfig

          echo "=== Namespace configuration ==="
          grep -E '^(CONFIG_NAMESPACES|CONFIG_IPC_NS|CONFIG_NET_NS|CONFIG_CGROUPS)=' .config || true

          for option in CONFIG_NAMESPACES CONFIG_IPC_NS CONFIG_NET_NS CONFIG_CGROUPS; do
            if ! grep -qx "${option}=y" .config; then
              echo "::error::$option is not enabled in the final configuration."
              exit 1
            fi
          done
      - name: Compilar Kernel
        working-directory: kernel
        continue-on-error: true
        run: |
          set -o pipefail

          make -j"$(nproc)" \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            CC="$CLANG" \
            HOSTCC=gcc 2>&1 | tee build.log

      - name: Extract Build Errors
        if: always()
        working-directory: kernel
        run: |
          echo "=== Compiler and linker errors ==="
          grep -inE \
            '(^|[[:space:]])(fatal )?error:|undefined reference|No such file|not found|Error [0-9]+|make: \*\*\*' \
            build.log | tail -100 || true

          echo "=== Last 100 lines ==="
          tail -100 build.log || true

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Eureka-Kernel-Build-Log
          path: kernel/build.log
          if-no-files-found: warn
    
      - name: Verificar Imagem
        run: |
          echo "Arquivos produzidos:"
          find kernel/arch/arm64/boot -maxdepth 2 -type f -print

          IMAGE="kernel/arch/arm64/boot/Image.gz-dtb"

          if [ ! -s "$IMAGE" ]; then
            echo "::error::Image.gz-dtb was not found."
            exit 1
          fi

      - name: Upload do Arquivo
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Eureka-A30s-Droidspaces
          path: kernel/arch/arm64/boot/Image.gz-dtb
          if-no-files-found: error
