```yaml
name: Compilador Automatizado Eureka Kernel A30s

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-kernel:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Instalar Dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc build-essential git libncurses-dev libssl-dev \
            libelf-dev bison flex python3 make

      - name: Baixar Código Fonte Eureka
        run: |
          git clone --depth 1 \
            https://github.com/eurekadevelopment/Eureka-Kernel \
            kernel

          cd kernel
          git submodule update --init --recursive

      - name: Baixar Toolchain
        run: |
          git clone --depth 1 \
            https://github.com/Chatur27/Toolchains-for-Eureka \
            toolchain

          echo "Toolchain executables:"
          find toolchain -maxdepth 3 -type f \
            \( -name clang -o -name aarch64-linux-gnu-gcc \
            -o -name aarch64-linux-gnu-ld \
            -o -name arm-linux-gnueabi-gcc \) -print

          test -x toolchain/bin/clang || {
            echo "::error::Clang not found at toolchain/bin/clang"
            exit 1
          }

          test -x toolchain/bin/aarch64-linux-gnu-ld || {
            echo "::error::AArch64 linker not found"
            exit 1
          }

      - name: Preparar Configuração
        run: |
          DEFCONFIG="kernel/arch/arm64/configs/exynos7885-a30s_defconfig"
          test -f "$DEFCONFIG" || {
            echo "::error::A30s defconfig not found"
            exit 1
          }

          cat >> "$DEFCONFIG" <<'EOF'

          # Droidspaces: requested namespace and cgroup options
          CONFIG_NAMESPACES=y
          CONFIG_IPC_NS=y
          CONFIG_NET_NS=y
          CONFIG_CGROUPS=y
          # KernelSU is not injected by this workflow.
          EOF

      - name: Configurar Kernel
        working-directory: kernel
        env:
          TOOLCHAIN: ${{ github.workspace }}/toolchain/bin
        run: |
          export PATH="$TOOLCHAIN:$PATH"

          make ARCH=arm64 \
            CROSS_COMPILE="$TOOLCHAIN/aarch64-linux-gnu-" \
            CROSS_COMPILE_ARM32="$TOOLCHAIN/arm-linux-gnueabi-" \
            CC="$TOOLCHAIN/clang" \
            HOSTCC=gcc \
            exynos7885-a30s_defconfig

          make ARCH=arm64 \
            CROSS_COMPILE="$TOOLCHAIN/aarch64-linux-gnu-" \
            CROSS_COMPILE_ARM32="$TOOLCHAIN/arm-linux-gnueabi-" \
            CC="$TOOLCHAIN/clang" \
            HOSTCC=gcc \
            olddefconfig

          echo "Checking generated configuration:"
          grep -E '^(CONFIG_NAMESPACES|CONFIG_IPC_NS|CONFIG_NET_NS|CONFIG_CGROUPS)=' .config || true

          grep -qx 'CONFIG_NAMESPACES=y' .config
          grep -qx 'CONFIG_IPC_NS=y' .config
          grep -qx 'CONFIG_NET_NS=y' .config
          grep -qx 'CONFIG_CGROUPS=y' .config

      - name: Compilar Kernel
        working-directory: kernel
        env:
          TOOLCHAIN: ${{ github.workspace }}/toolchain/bin
        run: |
          export PATH="$TOOLCHAIN:$PATH"

          make -j"$(nproc)" \
            ARCH=arm64 \
            CROSS_COMPILE="$TOOLCHAIN/aarch64-linux-gnu-" \
            CROSS_COMPILE_ARM32="$TOOLCHAIN/arm-linux-gnueabi-" \
            CC="$TOOLCHAIN/clang" \
            HOSTCC=gcc

      - name: Verificar Imagem
        run: |
          find kernel/arch/arm64/boot -maxdepth 2 -type f -print

          IMAGE="kernel/arch/arm64/boot/Image.gz-dtb"
          test -s "$IMAGE" || {
            echo "::error::Expected Image.gz-dtb was not produced"
            exit 1
          }

      - name: Upload do Arquivo
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Eureka-A30s-Droidspaces
          path: kernel/arch/arm64/boot/Image.gz-dtb
          if-no-files-found: error
```
